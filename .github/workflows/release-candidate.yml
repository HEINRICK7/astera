name: Astera Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version
        required: true
        default: 1.0.0-rc.1
      image_tag:
        description: Immutable image tag to promote
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate release candidate
        run: |
          python -m pytest -q
          python -m compileall -q apps packages
          git diff --check

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package Helm chart
        run: helm package infrastructure/helm/astera --version 0.1.0 --app-version "${{ inputs.version }}"
      - name: Publish boundary
        run: echo "Publish requires the configured production registry and provenance policy."
