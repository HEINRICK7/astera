name: Astera CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install runtime and development dependencies
      run: python -m pip install -r requirements.txt -r requirements-dev.txt
    - name: Run behavioral tests
      run: python -m pytest -q apps/runtime/tests
    - name: Run architecture fitness tests
      run: python -m pytest -q tests/architecture
    - name: Compile Python packages
      run: python -m compileall -q apps packages
    - name: Check patch formatting
      run: git diff --check
