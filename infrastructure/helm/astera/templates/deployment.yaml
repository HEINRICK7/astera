apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astera-runtime.fullname" . }}
  labels:
    {{- include "astera-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astera-runtime.name" . }}
  template:
    metadata:
      labels:
        {{- include "astera-runtime.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "astera-runtime.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ASTERA_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: ASTERA_API_HOST
              value: 0.0.0.0
            - name: ASTERA_API_PORT
              value: "8000"
            - name: ASTERA_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: {{ .Values.authSecretKey }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
