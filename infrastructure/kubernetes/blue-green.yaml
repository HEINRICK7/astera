apiVersion: apps/v1
kind: Deployment
metadata:
  name: astera-runtime-blue
  namespace: astera
  labels:
    app.kubernetes.io/name: astera-runtime
    astera.io/color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: astera-runtime
      astera.io/color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astera-runtime
        astera.io/color: blue
    spec:
      serviceAccountName: astera-runtime
      containers:
        - name: runtime
          image: ghcr.io/astera/astera-runtime:0.1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astera-runtime-green
  namespace: astera
  labels:
    app.kubernetes.io/name: astera-runtime
    astera.io/color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: astera-runtime
      astera.io/color: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astera-runtime
        astera.io/color: green
    spec:
      serviceAccountName: astera-runtime
      containers:
        - name: runtime
          image: ghcr.io/astera/astera-runtime:0.1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
