---
apiVersion: v1
kind: Service
metadata:
  name: astera-runtime
  namespace: astera
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: astera-runtime
    astera.io/color: blue
  ports:
    - name: http
      port: 80
      targetPort: http
---
