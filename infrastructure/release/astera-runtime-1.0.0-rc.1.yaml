apiVersion: astera.io/v1alpha1
kind: ReleaseCandidate
metadata:
  name: astera-runtime-1-0-0-rc-1
  labels:
    app.kubernetes.io/part-of: astera
spec:
  version: 1.0.0-rc.1
  image:
    repository: ghcr.io/astera/astera-runtime
    tag: 1.0.0-rc.1
  helm:
    chart: infrastructure/helm/astera
    version: 0.1.0
  validation:
    test_command: python -m pytest -q
    compile_command: python -m compileall -q apps packages
    expected_test_count: 76
  promotion:
    strategy: blue-green
    rollback: helm-revision
